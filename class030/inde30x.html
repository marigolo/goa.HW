<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style30.css">
    <title>Document</title>

<body>
        <!-- 2) საიტზე დაამატეთ კონტეინერი, რომელშიც 5 შვილ Div-ს ჩააშენებთ. გამოიყენეთ flex-grow იმისთვის,
        რომ პირველი ელემენტი იკავებდეს ყველაზე მეტ ადგილს, ხოლო დანარჩენები თანაბრად გადანაწილდნენ. -->

    <div class="diraction">  
        <h2>დავალება 2</h2>
        <div class="box">
            <div id="items1" class="item">1</div>
            <div class="item">2</div>
            <div class="item">3</div>
            <div class="item">4</div>
            <div class="item">5</div>
        </div>

        <!-- 3) საიტზე დაამატეთ კონტეინერი, რომელშიც 3 შვილ Div-ს ჩააშენებთ. მხოლოდ შუა ელემენტს მიანიჭეთ flex-grow: 1; დანარჩენებს 0. დააკვირდით შედეგს. -->
        <h2>დავალება 3</h2>
        <div class="box">
            <div class="item  items">1</div>
            <div class="item  items" id="items">2</div>
            <div class="item  items">3</div>
        </div>

        <h2>დავალება 4</h2>
        <div class="box__row">
            <div class="item">1</div>
            <div class="item">2</div>
            <div class="item">3</div>
        </div>

        <div class="box__row__reverse">
            <div class="item">1</div>
            <div class="item">2</div>
            <div class="item">3</div>
        </div>
        
        <div class="box__column">
            <div class="item">1</div>
            <div class="item">2</div>
            <div class="item">3</div>
        </div>

        <div class="box__column__reverse">
            <div class="item">1</div>
            <div class="item">2</div>
            <div class="item">3</div>
        </div>

    </div>

<!-- 8) გამოიყენეთ Flexbox და აქამდე ნასწავლი flex-ის კუთვნილებები იმისთვის, რომ შექმნათ ანალოგიური ელემენტების განლაგებები: -->
    <h2>დავალება 8</h2>
    <div class="numeration">
        <p>ა)</p>
    </div>
    <div class="main__box">
    <div class="main__child">
        <p>Flexbox</p>
    </div>
    
    <div class="main__child1">
        <div class="child"></div>
        <div class="childs__cild">
            <div class="child1"></div>
            <div class="child1"></div>
        </div>
        <div class="child"></div>
    </div>
</div>

<div class="numeration">
    <p>ბ)</p>
</div>

<div class="flex">
    <div class="first_c">
        <div class="child_1"></div>
        <div class="child2"></div>
        <div class="child_1"></div>
    </div>
    <div class="secound_c">
        <div class="child2"></div>
        <div class="child_1"></div>
        <div class="child3"></div>
    </div>

    <div class="thirth_c">
        <div class="child_1"></div>
        <div class="child3"></div>
        <div class="child2"></div>
    </div>
    
    <div class="forth_c">
        <div class="child3"></div>
        <div class="child_1"></div>
        <div class="child3"></div>
        <div class="child_1"></div>
        <div class="child3"></div>
    </div>
 
</div>

</body>
</html>
