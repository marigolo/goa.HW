<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mortgage Calculator</title>
    <link rel="stylesheet" href="style41.css">
</head>

<body>

    <div class="calculator">

        <div class="left">

            <div class="l__top">
                <h2>Mortgage Calculator</h2>
                <a href="#">Clear All</a>
            </div>

            <label>Mortgage Amount</label>
            <div class="input">
                <span>£</span>
                <input type="text">
            </div>

            <div class="row">

                <div class="field">
                    <label>Mortgage Term</label>
                    <div class="input-box">
                        <input type="text">
                        <span>years</span>
                    </div>
                </div>

                <div class="field">
                    <label>Interest Rate</label>
                    <div class="input-box">
                        <input type="text">
                        <span>%</span>
                    </div>
                </div>

            </div>

            <label>Mortgage Type</label>

            <div class="radio">
                <input type="radio" name="mortgage">
                <p>Repayment</p>
            </div>

            <div class="radio">
                <input type="radio" name="mortgage">
                <p>Interest Only</p>
            </div>

            <button>
                📱 Calculate Repayments
            </button>

        </div>

        <div class="right">

            <img src="https://imgs.search.brave.com/pWiU3RZwqvq4w_Sk3hR5NE05oCwJVzYalO5ZTN_UblA/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly93d3cu/cHJvbW9wYXJyb3Qu/Y29tL3dwLWNvbnRl/bnQvdXBsb2Fkcy8y/MDE4LzAyL3Byb2R1/Y3RzLWNhMTYwNl9p/bWFnZV9jYWxjdWxh/dG9yX2RpZ2l0YWwu/anBn" alt="calculator">

            <h2>Results shown here</h2>

            <p>
                Complete the form and click "calculate repayments"
                to see what your monthly repayments would be.
            </p>

        </div>

    </div>

</body>

</html>
